name: GUI CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gui:
    name: Dashboard tests
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-gui.txt
            requirements.txt
            constraints.txt
      - name: Install GUI dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Run dashboard tests and reject skips
        run: |
          # Use a fresh network namespace and run Python as the runner user.
          sudo --non-interactive unshare --net -- \
            setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups --no-new-privs -- \
            env HOME="$HOME" MPLBACKEND="$MPLBACKEND" "$(command -v python)" run_gui_tests.py
